<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 485" role="img" aria-labelledby="title desc">
  <title id="title">Anilina frente a bencilamina</title>
  <desc id="desc">A la izquierda, el par del nitrógeno de anilina se conjuga directamente con el anillo. A la derecha, un carbono CH2 saturado separa el nitrógeno del anillo en bencilamina.</desc>
  <defs>
    <style>
      .bg{fill:#f8f6f2}.panel{fill:#fff;stroke:#d8d3dd;stroke-width:2}.bond{fill:none;stroke:#201d29;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.inside{stroke-width:2.7}.label{font:700 30px Arial,sans-serif;fill:#251f2c}.small{font:22px Arial,sans-serif;fill:#453b4b}.tiny{font:19px Arial,sans-serif;fill:#453b4b}.n{fill:#126b76}.highlight{fill:#b04b70}.path{fill:none;stroke:#b04b70;stroke-width:4;stroke-linecap:round;stroke-dasharray:9 8}.bar{fill:#fad77f}
    </style>
  </defs>
  <rect class="bg" width="1100" height="485"/>
  <rect class="panel" x="24" y="25" width="508" height="432" rx="10"/>
  <rect class="panel" x="568" y="25" width="508" height="432" rx="10"/>
  <rect class="bar" x="24" y="25" width="508" height="10"/>
  <rect class="bar" x="568" y="25" width="508" height="10"/>
  <text class="label" x="55" y="81">ANILINA</text>
  <text class="label" x="600" y="81">BENCILAMINA</text>
  <text class="small" x="55" y="114">N unido directamente al anillo</text>
  <text class="small" x="600" y="114">Un CH₂ separa N del anillo</text>
  <!-- Anillo bencénico: tres dobles enlaces alternados. -->
  <path class="bond" d="M157 189 L213 157 L269 189 L269 254 L213 286 L157 254 Z"/>
  <path class="bond inside" d="M167 197 L213 170 M259 197 L259 246 M213 273 L167 246"/>
  <path class="bond" d="M269 189 L333 189"/>
  <text class="label n" x="345" y="200">NH₂</text>
  <circle cx="342" cy="162" r="3.7" fill="#126b76"/><circle cx="355" cy="162" r="3.7" fill="#126b76"/>
  <path class="path" d="M342 150 C316 123 284 139 269 166"/>
  <text class="tiny highlight" x="55" y="341">Par de N ↔ sistema π</text>
  <text class="tiny" x="55" y="372">Al protonar N: se pierde esta donación.</text>
  <text class="tiny" x="55" y="400">El benceno sigue siendo aromático.</text>
  <!-- Bencilamina: el carbono saturado CH2 rompe el camino de orbitales p. -->
  <path class="bond" d="M700 189 L756 157 L812 189 L812 254 L756 286 L700 254 Z"/>
  <path class="bond inside" d="M710 197 L756 170 M802 197 L802 246 M756 273 L710 246"/>
  <path class="bond" d="M812 189 L846 189 M913 189 L936 189"/>
  <text class="small highlight" x="851" y="197">CH₂</text>
  <text class="label n" x="945" y="200">NH₂</text>
  <circle cx="942" cy="162" r="3.7" fill="#126b76"/><circle cx="955" cy="162" r="3.7" fill="#126b76"/>
  <path d="M881 212 L881 241" stroke="#b04b70" stroke-width="5"/>
  <text class="tiny highlight" x="599" y="341">CH₂ sp³ corta la conjugación directa.</text>
  <text class="tiny" x="599" y="372">El par de N no se comunica con el anillo</text>
  <text class="tiny" x="599" y="400">por un camino continuo de orbitales p.</text>
</svg>
