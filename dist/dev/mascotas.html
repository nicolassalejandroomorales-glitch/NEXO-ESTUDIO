<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mascotas · hoja de diseño</title>
<style>
  :root { --bg:#1f1a15; --card:#2b241d; --ink:#f4e8d2; --muted:#c3b291; --gold:#e8b65a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 Georgia, 'Times New Roman', serif; padding:24px 16px 48px; }
  h1 { margin:0 0 4px; font-size:28px; } .sub { color:var(--muted); margin:0 0 24px; }
  .sheet { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:20px; max-width:1400px; }
  .card { background:var(--card); border:1px solid #4a3d2e; border-radius:14px; padding:18px; }
  .card h2 { margin:0; font-size:22px; color:var(--gold); } .card p { margin:4px 0 12px; color:var(--muted); }
  .hero { background:radial-gradient(circle at 50% 40%,#3d3328,#2b241d 70%); border-radius:10px; }
  .hero svg { width:100%; height:auto; display:block; }
  .row { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:10px; }
  .row figure { margin:0; background:#241e18; border-radius:8px; padding:4px; text-align:center; }
  .row svg { width:100%; height:auto; display:block; } .row figcaption { font-size:12px; color:var(--muted); }
  .palette { display:flex; gap:6px; margin-top:12px; } .palette span { width:26px; height:26px; border-radius:50%; border:2px solid #0004; }
  .room { margin-top:28px; max-width:1400px; position:relative; aspect-ratio:1672/941; background:url('../assets/home-scenes/refugio-012.png') center/cover; border-radius:12px; overflow:hidden; }
  .room svg { position:absolute; width:8.6%; height:auto; filter:drop-shadow(0 4px 3px #1e221650); }
  .note { color:var(--muted); max-width:1400px; margin-top:8px; font-size:14px; }
</style>
</head>
<body>
<h1>Mascotas de Nexo · hoja de diseño v1</h1>
<p class="sub">Un solo esqueleto para las tres (cabeza, cuerpo, brazos, piernas, cola) → las mismas animaciones sirven para todas.</p>
<div class="sheet" id="sheet"></div>
<div class="room" id="room" aria-label="Las tres mascotas a escala real en el refugio"></div>
<p class="note">Abajo: tamaño real sobre la sala (escritorio, alfombra y sillón).</p>
<script src="../mascot/art.js?v=1"></script>
<script>
  const A = window.NexoMascotArt;
  const expressions = [['neutral','Normal'],['happy','Feliz'],['scared','Susto'],['sleep','Dormido']];
  document.getElementById('sheet').innerHTML = A.species.map(id => {
    const info = A.info(id), c = info.colors;
    return `<article class="card"><h2>${info.name}</h2><p>${info.personality}</p>
      <div class="hero">${A.svg(id)}</div>
      <div class="row">${expressions.map(([e,l]) => `<figure>${A.svg(id,{expression:e})}<figcaption>${l}</figcaption></figure>`).join('')}</div>
      <div class="palette">${['line','shadow','base','light','belly','accent'].map(k => `<span style="background:${c[k]}" title="${k}"></span>`).join('')}</div></article>`;
  }).join('');
  const spots = { raptor:[14,38], capybara:[44,62], fox:[78,52] };
  document.getElementById('room').innerHTML = A.species.map(id => `<span>${A.svg(id)}</span>`).join('');
  [...document.querySelectorAll('#room svg')].forEach((el, i) => { const [x,y] = spots[A.species[i]]; el.style.left = x + '%'; el.style.top = y + '%'; });
</script>
</body>
</html>
