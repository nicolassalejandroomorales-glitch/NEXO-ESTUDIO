<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mascota en la sala · demo</title>
<style>
  :root { --bg:#1f1a15; --card:#2b241d; --ink:#f4e8d2; --muted:#c3b291; --gold:#e8b65a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 Georgia, serif; padding:20px 16px 48px; }
  h1 { margin:0 0 4px; font-size:26px; } .sub { color:var(--muted); margin:0 0 12px; max-width:980px; }
  .controls { display:flex; flex-wrap:wrap; gap:8px; margin:0 0 12px; }
  button { font:inherit; padding:8px 14px; border-radius:8px; border:1px solid #6b5a40; background:#2b241d; color:var(--ink); cursor:pointer; }
  button[aria-pressed="true"] { border-color:var(--gold); color:var(--gold); }
  .room { position:relative; max-width:1200px; aspect-ratio:1672/941; background:url('../assets/home-scenes/refugio-012.png') center/cover; border-radius:12px; overflow:hidden; }
  /* El caminante: left/top = punto de apoyo (pies); el ancho depende de la profundidad. El halo cálido lo separa del fondo. */
  .walker { position:absolute; width:calc(12% * var(--depth, 1)); transform:translate(-50%, -91%); pointer-events:none;
    filter:drop-shadow(0 0 5px rgba(255,236,190,.55)) drop-shadow(0 0 14px rgba(255,214,150,.25)); }
  .walker .flip { transition:transform .3s ease; } .walker.left .flip { transform:scaleX(-1); }
  .carry { position:absolute; left:50%; top:-14%; width:34%; transform:translateX(-50%); }
  .carry .bk { animation:bob 1s ease-in-out infinite; } @keyframes bob { 50% { transform:translateY(-4%); } }
  .reading { position:absolute; left:56%; top:62%; width:58%; }
  .flybook { position:absolute; width:3.4%; transform:translate(-50%,-50%); pointer-events:none; filter:drop-shadow(0 0 4px rgba(255,236,190,.6)); }
  .zzz { position:absolute; left:62%; top:-6%; font:bold 22px Georgia; color:#fff6dc; text-shadow:0 0 6px #000a; }
  .zzz span { position:absolute; animation:z 2.4s ease-out infinite; opacity:0; } .zzz span:nth-child(2) { animation-delay:.8s; left:12px; } .zzz span:nth-child(3) { animation-delay:1.6s; left:24px; }
  @keyframes z { 0% { transform:translateY(0) scale(.6); opacity:0; } 20% { opacity:1; } 100% { transform:translateY(-40px) scale(1.2); opacity:0; } }
  .status { color:var(--muted); font-size:14px; margin-top:8px; }
  .debug .node { position:absolute; width:10px; height:10px; margin:-5px; border-radius:50%; background:#ff3b3b; box-shadow:0 0 0 2px #fff; }
  .debug .node small { position:absolute; left:12px; top:-4px; color:#fff; font:11px monospace; background:#000a; padding:0 3px; white-space:nowrap; }
  /* Detalles que siguen en CSS (no dependen de caminar): parpadeo, destellos y burbujas. */
  .m-svg, .m-svg * { transform-box:view-box; }
  .m-svg { overflow:visible; display:block; width:100%; height:auto; }
  .m-eye { animation:blink 4.6s infinite; }
  @keyframes blink { 0%, 93%, 100% { transform:scaleY(1); } 95.5% { transform:scaleY(.08); } }
  .sleeping .m-eye { animation:none; transform:scaleY(.1); }
  .m-twinkle { animation:twinkle 2.4s ease-in-out infinite; transform-origin:center; transform-box:fill-box; }
  @keyframes twinkle { 50% { opacity:.25; transform:scale(.6); } }
  .m-bubbles circle { animation:rise 3.2s linear infinite; }
  .m-bubbles circle:nth-child(2n) { animation-duration:2.6s; animation-delay:-1.1s; } .m-bubbles circle:nth-child(3n) { animation-duration:3.8s; animation-delay:-2s; }
  @keyframes rise { 0% { transform:translateY(0); opacity:1; } 85% { opacity:1; } 100% { transform:translateY(-34px); opacity:0; } }
  @media (prefers-reduced-motion: reduce) { .m-svg *, .carry .bk, .zzz span { animation:none !important; } }
</style>
</head>
<body>
<h1>Mascota en la sala · demo</h1>
<p class="sub">Pasea por el suelo, saca un libro de la estantería, lo lleva al escritorio y lo lee; después se va a dormir al sillón.
Los movimientos se mezclan suavemente (acelera, frena y pasa de quieto a caminar sin saltos).</p>
<div class="controls" id="pick"></div>
<div class="controls"><button id="acc">Probar accesorios</button><button id="pause">Pausar paseo</button><button id="debug">Ver puntos del suelo</button></div>
<div class="room" id="room"><div class="walker" id="walker"><div class="flip" id="pet"></div></div></div>
<p class="status" id="status"></p>
<script src="alquimicos.js?v=4"></script>
<script>
// ——— Lugares (fracciones del arte 1672×941). "perch" = lugares en altura: se llega saltando. ———
const NODES = {
  desk:      { at: [.205, .555], perch: .8, say: 'Leyendo sobre el escritorio' },
  nearDesk:  { at: [.25, .80] },
  rug:       { at: [.47, .86] },
  shelf:     { at: [.61, .70], say: 'Sacando un libro de la estantería' },
  chairSide: { at: [.76, .82] },
  chair:     { at: [.805, .62], perch: .78, say: 'Durmiendo una siesta en el sillón' }
};
const BOOK_SLOT = [.632, .44]; // de dónde sale el libro (estante bajo)
const ROUTE = ['nearDesk', 'rug', 'shelf', 'rug', 'nearDesk', 'desk', 'nearDesk', 'rug', 'chairSide', 'chair', 'chairSide', 'rug', 'nearDesk', 'desk'];
const room = document.getElementById('room'), walker = document.getElementById('walker'), pet = document.getElementById('pet'), status = document.getElementById('status');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const depth = y => Math.max(.62, Math.min(1.2, .62 + (y - .62) * 1.9));   // más arriba en el suelo = más lejos = más chica
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;   // acelera y frena
const wait = ms => new Promise(r => setTimeout(r, ms));
const BOOK = '<svg viewBox="0 0 40 46" class="bk"><path d="M5 4 L33 2 C35 2 36 3 36 5 L37 40 C37 42 36 43 34 43 L8 45 C6 45 5 44 5 42 Z" fill="#8e3b2e" stroke="#3b2418" stroke-width="2.4" stroke-linejoin="round"/><path d="M5 4 L11 4 L12 44 L8 45 C6 45 5 44 5 42 Z" fill="#6a2a20"/><path d="M21 3 L24 3 L25 43 L22 43 Z" fill="#e3b04b"/><path d="M33 2 L37 4 L38 40 L36 42" fill="#fbf3dc" stroke="#3b2418" stroke-width="1.6"/></svg>';
const OPEN_BOOK = '<svg viewBox="0 0 80 46"><path d="M40 10 C30 4 14 4 4 8 L4 42 C14 38 30 38 40 44 C50 38 66 38 76 42 L76 8 C66 4 50 4 40 10 Z" fill="#8e3b2e" stroke="#3b2418" stroke-width="2.4" stroke-linejoin="round"/><path d="M40 12 C31 7 17 7 8 10 L8 39 C17 36 31 36 40 41 C49 36 63 36 72 39 L72 10 C63 7 49 7 40 12 Z" fill="#fbf3dc" stroke="#3b2418" stroke-width="1.6"/><path d="M40 12 L40 41" stroke="#3b2418" stroke-width="1.6"/><path d="M14 16 L34 17 M14 21 L34 22 M14 26 L30 27 M46 17 L66 16 M46 22 L66 21 M46 27 L62 26" stroke="#b9a07a" stroke-width="1.6" stroke-linecap="round"/></svg>';

// ——— Animador por código: cada cuadro calcula la pose y MEZCLA "quieto" y "caminar" con un peso que sube y baja suave. ———
const anim = { kind: 'matraz', parts: {}, w: 0, target: 0, phase: 0, t: 0, air: 0, sit: 0, sitTarget: 0, last: performance.now() };
function bindParts() {
  const q = c => pet.querySelector('.' + c);
  anim.parts = { root: q('m-root'), body: q('m-body'), liquid: q('m-liquid'), footL: q('m-foot-l'), footR: q('m-foot-r'), tag: q('m-tag'), hat: q('m-hat') };
}
const tf = (el, v) => { if (el) el.style.transform = v; };
function frame(now) {
  const dt = Math.min(.05, (now - anim.last) / 1000); anim.last = now;
  anim.t += dt;
  const k = 1 - Math.exp(-dt * 5);                       // suavizado exponencial (independiente de los FPS)
  anim.w += (anim.target - anim.w) * k; anim.sit += (anim.sitTarget - anim.sit) * k;
  const w = reduced ? 0 : anim.w, s = anim.sit, P = anim.parts, t = anim.t;
  const freq = { matraz: 1.9, atomo: 1, slime: 1.4 }[anim.kind];
  anim.phase += dt * Math.PI * 2 * freq * (0.25 + 0.75 * w);
  const ph = anim.phase, idle = Math.sin(t * 2 * Math.PI / 3.2);
  const air = anim.air;                                   // 0..1 durante un salto (lo pone moveTo)
  if (anim.kind === 'matraz') {
    const step = Math.sin(ph);
    tf(P.root, `translateY(${-4.5 * w * Math.abs(step) - 18 * air}px) rotate(${6 * w * step}deg) scale(${1 - .05 * s * 0}, 1)`);
    tf(P.body, `rotate(${1.6 * idle * (1 - w) - 3 * s}deg) scale(${1 + .06 * air - .03 * s}, ${1 + .1 * air - .05 * s})`);
    tf(P.liquid, `rotate(${3 * idle * (1 - w) - 9 * w * Math.sin(ph - .7)}deg)`);
    tf(P.footL, `translateY(${-7 * w * Math.max(0, step)}px)`);
    tf(P.footR, `translateY(${-7 * w * Math.max(0, -step)}px)`);
    tf(P.tag, `rotate(${6 * Math.sin(t * 2) + 10 * w * Math.sin(ph - 1)}deg)`);
  } else if (anim.kind === 'slime') {
    const up = Math.max(0, Math.sin(ph)), down = Math.max(0, -Math.sin(ph));
    const wob = Math.sin(t * 2 * Math.PI / 1.9);
    tf(P.root, `translateY(${-26 * w * up - 20 * air}px)`);
    const sx = 1 + .04 * wob * (1 - w) + w * (-.08 * up + .16 * down) + .1 * s, sy = 1 - .04 * wob * (1 - w) + w * (.12 * up - .18 * down) - .14 * s;
    tf(P.body, `scale(${sx}, ${sy})`);
    tf(P.hat, `rotate(${3 * wob + 8 * w * Math.sin(ph - 1)}deg)`);
  } else {
    const bob = Math.sin(t * 2 * Math.PI / 3);
    tf(P.root, `translateY(${-9 * bob * (1 - w) - (8 + 4 * Math.sin(ph)) * w - 10 * air + 10 * s}px) rotate(${9 * w}deg)`);
    tf(P.body, `scale(${1 + .035 * Math.sin(t * 2.1)})`);
  }
  requestAnimationFrame(frame);
}

// ——— Movimiento por la sala ———
let pos = NODES.nearDesk.at.slice(), perch = null, paused = false, carrying = false;
function place([x, y], d) {
  walker.style.left = x * 100 + '%'; walker.style.top = y * 100 + '%';
  walker.style.setProperty('--depth', d);
}
async function moveTo(name) {
  const node = NODES[name], from = pos.slice(), to = node.at, jump = Boolean(node.perch) !== Boolean(perch);
  const d0 = perch ? NODES[perch].perch : depth(from[1]), d1 = node.perch || depth(to[1]);
  const dist = Math.hypot(to[0] - from[0], (to[1] - from[1]) * 1.78);
  const speed = { atomo: .085, slime: .075, matraz: .065 }[anim.kind];
  const ms = reduced ? 1 : jump ? 900 : Math.max(600, dist / speed * 1000);
  if (Math.abs(to[0] - from[0]) > .005) walker.classList.toggle('left', to[0] < from[0]);
  anim.target = jump ? 0 : 1;
  const t0 = performance.now();
  await new Promise(done => {
    const tick = now => {
      if (paused) { requestAnimationFrame(tick); return; }
      const t = Math.min(1, (now - t0) / ms), e = jump ? t : ease(t);
      anim.air = jump ? Math.sin(Math.PI * t) : 0;
      pos = [from[0] + (to[0] - from[0]) * e, from[1] + (to[1] - from[1]) * e];
      place([pos[0], pos[1] - (jump ? Math.sin(Math.PI * t) * .1 : 0)], d0 + (d1 - d0) * e);
      if (!jump && t > .8) anim.target = 0;                // empieza a frenar antes de llegar
      t < 1 ? requestAnimationFrame(tick) : done();
    };
    requestAnimationFrame(tick);
  });
  anim.air = 0; anim.target = 0; perch = node.perch ? name : null;
}
// Un libro sale volando del estante en arco y queda sobre la cabeza de la mascota.
async function takeBook() {
  const fly = document.createElement('div'); fly.className = 'flybook'; fly.innerHTML = BOOK; room.append(fly);
  const [x0, y0] = BOOK_SLOT, x1 = pos[0], y1 = pos[1] - .17;
  await fly.animate([
    { left: x0 * 100 + '%', top: y0 * 100 + '%', transform: 'translate(-50%,-50%) rotate(0deg)' },
    { left: ((x0 + x1) / 2) * 100 + '%', top: (Math.min(y0, y1) - .08) * 100 + '%', transform: 'translate(-50%,-50%) rotate(-200deg)', offset: .5 },
    { left: x1 * 100 + '%', top: y1 * 100 + '%', transform: 'translate(-50%,-50%) rotate(-360deg)' }
  ], { duration: reduced ? 1 : 1100, easing: 'ease-in-out' }).finished;
  fly.remove();
  walker.insertAdjacentHTML('beforeend', `<div class="carry">${BOOK}</div>`); carrying = true;
}
function readBook(on) {
  walker.querySelector('.carry')?.remove();
  walker.querySelector('.reading')?.remove();
  if (on) walker.insertAdjacentHTML('beforeend', `<div class="reading">${OPEN_BOOK}</div>`);
  carrying = false;
}
async function loop() {
  place(pos, depth(pos[1]));
  for (let i = 0; ; i++) {
    const name = ROUTE[i % ROUTE.length], node = NODES[name];
    if (node.say) status.textContent = node.say.replace(/^\w+/, m => m) + '…';
    await moveTo(name);
    while (paused) await wait(200);
    if (name === 'shelf' && !carrying) { status.textContent = 'Sacando un libro de la estantería…'; await takeBook(); await wait(700); }
    else if (name === 'desk') {
      if (carrying) { status.textContent = 'Leyendo sobre el escritorio.'; readBook(true); await wait(6500); readBook(false); }
      else { status.textContent = 'Acompañándote en el escritorio.'; await wait(3500); }
    } else if (name === 'chair') {
      status.textContent = 'Durmiendo una siesta en el sillón.'; walker.classList.add('sleeping'); anim.sitTarget = 1;
      walker.insertAdjacentHTML('beforeend', '<div class="zzz"><span>z</span><span>z</span><span>z</span></div>');
      await wait(7000);
      walker.classList.remove('sleeping'); anim.sitTarget = 0; walker.querySelector('.zzz')?.remove(); await wait(500);
    } else await wait(900);
  }
}

// ——— Controles ———
let accOn = false;
function setKind(k) {
  anim.kind = k; pet.innerHTML = Alquimicos[k](); bindParts();
  if (accOn) ['sombrero', 'lentes', 'corbatin'].forEach(a => Alquimicos.equip(pet, a));
  document.querySelectorAll('#pick button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.k === k)));
}
document.getElementById('pick').innerHTML = Alquimicos.list.map(([k, l]) => `<button data-k="${k}">${l}</button>`).join('');
document.getElementById('pick').addEventListener('click', e => { if (e.target.dataset.k) setKind(e.target.dataset.k); });
document.getElementById('acc').addEventListener('click', e => {
  accOn = !accOn; e.target.setAttribute('aria-pressed', String(accOn));
  accOn ? ['sombrero', 'lentes', 'corbatin'].forEach(a => Alquimicos.equip(pet, a)) : Alquimicos.unequip(pet);
});
document.getElementById('pause').addEventListener('click', e => { paused = !paused; e.target.textContent = paused ? 'Seguir paseo' : 'Pausar paseo'; });
document.getElementById('debug').addEventListener('click', () => {
  room.classList.toggle('debug');
  room.querySelectorAll('.node').forEach(n => n.remove());
  if (room.classList.contains('debug')) [...Object.entries(NODES).map(([k, n]) => [k, n.at]), ['libro', BOOK_SLOT]].forEach(([k, at]) =>
    room.insertAdjacentHTML('beforeend', `<span class="node" style="left:${at[0] * 100}%;top:${at[1] * 100}%"><small>${k}</small></span>`));
});
setKind(new URLSearchParams(location.search).get('m') || 'matraz');
requestAnimationFrame(frame);
loop();
</script>
</body>
</html>
